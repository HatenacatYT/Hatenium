name: Build Hatenium

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach Hatenium.exe to a GitHub Release on tags

jobs:
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64 + MinGW-w64 GCC, CMake, Ninja)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Collect files
        run: |
          mkdir -p dist
          cp build/Hatenium.exe dist/
          cp -r assets dist/assets
          mkdir -p dist/config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hatenium-${{ matrix.build_type }}-windows-x64
          path: dist/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hatenium-Release-windows-x64
          path: Hatenium
      - name: Zip
        run: zip -r Hatenium-${{ github.ref_name }}-windows-x64.zip Hatenium
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Hatenium-${{ github.ref_name }}-windows-x64.zip
